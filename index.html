<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メキシコ割り勘計算機 (IVA控除・チップ込)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; color: #333; padding: 20px; display: flex; justify-content: center; }
    .card { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; text-align: center; color: #1a202c; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
    input[type="number"] { width: 100%; padding: 12px; font-size: 1.1rem; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; }
    input[type="number"]:focus { border-color: #3182ce; }
    .tip-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tip-btn { padding: 10px; border: 1.5px solid #cbd5e0; background: #fff; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .tip-btn.active { background: #3182ce; color: #fff; border-color: #3182ce; }
    .result-box { background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 12px; padding: 18px; margin-top: 20px; text-align: center; }
    .per-person-label { font-size: 0.85rem; color: #2b6cb0; font-weight: 600; }
    .per-person-val { font-size: 2rem; font-weight: 800; color: #2b6cb0; margin: 4px 0; }
    .details { margin-top: 14px; border-top: 1px dashed #cbd5e0; padding-top: 12px; font-size: 0.85rem; color: #718096; text-align: left; }
    .details-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .details-row.total { font-weight: 700; color: #2d3748; }
  </style>
</head>
<body>

<div class="card">
  <h1>🇲🇽 割り勘計算機 (税還付・チップ)</h1>

  <div class="form-group">
    <label>税込レシート総額 (MXN)</label>
    <input type="number" id="totalAmount" placeholder="例: 1160" value="1160" inputmode="decimal">
  </div>

  <div class="form-group">
    <label>チップ率</label>
    <div class="tip-buttons">
      <button type="button" class="tip-btn" onclick="setTip(10)">10%</button>
      <button type="button" class="tip-btn active" onclick="setTip(15)">15%</button>
    </div>
  </div>

  <div class="form-group">
    <label>人数</label>
    <input type="number" id="peopleCount" value="4" min="1" inputmode="numeric">
  </div>

  <div class="result-box">
    <div class="per-person-label">1人あたりの支払額（切り上げ）</div>
    <div class="per-person-val" id="perPersonDisplay">294 MXN</div>

    <div class="details">
      <div class="details-row"><span>料理本体 (税抜 1/1.16):</span><span id="subtotalDisplay">1,000.00 MXN</span></div>
      <div class="details-row"><span>チップ額 (総額基準):</span><span id="tipDisplay">174.00 MXN</span></div>
      <div class="details-row"><span>控除されたIVA (16%):</span><span id="taxDisplay">-160.00 MXN</span></div>
      <div class="details-row total"><span>割るべき合計額:</span><span id="targetTotalDisplay">1,174.00 MXN</span></div>
    </div>
  </div>
</div>

<script>
  let tipPercent = 15;

  function setTip(pct) {
    tipPercent = pct;
    document.querySelectorAll('.tip-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.includes(pct + '%'));
    });
    calculate();
  }

  function calculate() {
    const total = parseFloat(document.getElementById('totalAmount').value) || 0;
    const people = parseInt(document.getElementById('peopleCount').value, 10) || 1;

    // 計算ロジック
    const subtotal = total / 1.16;          // 料理本体価格（税抜）
    const tip = total * (tipPercent / 100);  // 税込総額に対するチップ
    const tax = total - subtotal;           // 還付・除外対象のIVA
    const targetTotal = subtotal + tip;     // 割り勘対象の合計額

    // 端数切り上げ（1ペソ単位）
    const perPerson = Math.ceil(targetTotal / Math.max(1, people));

    // 表示更新
    document.getElementById('subtotalDisplay').innerText = subtotal.toFixed(2) + ' MXN';
    document.getElementById('tipDisplay').innerText = tip.toFixed(2) + ' MXN';
    document.getElementById('taxDisplay').innerText = '-' + tax.toFixed(2) + ' MXN';
    document.getElementById('targetTotalDisplay').innerText = targetTotal.toFixed(2) + ' MXN';
    document.getElementById('perPersonDisplay').innerText = perPerson.toLocaleString() + ' MXN';
  }

  document.getElementById('totalAmount').addEventListener('input', calculate);
  document.getElementById('peopleCount').addEventListener('input', calculate);
  calculate();
</script>

</body>
</html>
