<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メキシコ割り勘計算機</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; color: #333; padding: 20px; display: flex; justify-content: center; }
    .card { background: #fff; width: 100%; max-width: 440px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; text-align: center; color: #1a202c; }
    
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
    input[type="number"] { width: 100%; padding: 12px; font-size: 1.1rem; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; }
    input[type="number"]:focus { border-color: #3182ce; }
    
    .btn-group { display: grid; gap: 8px; }
    .btn-group.col-2 { grid-template-columns: 1fr 1fr; }
    .toggle-btn { padding: 10px; border: 1.5px solid #cbd5e0; background: #fff; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: #4a5568; transition: all 0.15s ease; }
    .toggle-btn.active { background: #3182ce; color: #fff; border-color: #3182ce; }
    
    .result-box { background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 12px; padding: 18px; margin-top: 20px; text-align: center; }
    .per-person-label { font-size: 0.85rem; color: #2b6cb0; font-weight: 600; }
    .per-person-container { margin: 6px 0; display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 6px; }
    .per-person-val { font-size: 1.9rem; font-weight: 800; color: #2b6cb0; }
    .per-person-exact { font-size: 1.15rem; font-weight: 600; color: #4a5568; }
    
    .details { margin-top: 14px; border-top: 1px dashed #cbd5e0; padding-top: 12px; font-size: 0.85rem; color: #718096; text-align: left; }
    .details-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .details-row.total { font-weight: 700; color: #2d3748; margin-top: 4px; padding-top: 4px; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>

<div class="card">
  <h1>🇲🇽 メキシコ割り勘計算機</h1>

  <div class="form-group">
    <label>税込レシート総額 (MXN)</label>
    <input type="number" id="totalAmount" placeholder="例: 1160" value="1160" inputmode="decimal">
  </div>

  <div class="form-group">
    <label>IVA（税金 16%）の扱い</label>
    <div class="btn-group col-2">
      <button type="button" class="toggle-btn active" id="btnIvaDeduct" onclick="setIvaMode('deduct')">IVA控除 (本体+チップ)</button>
      <button type="button" class="toggle-btn" id="btnIvaInclude" onclick="setIvaMode('include')">IVA込み (総額+チップ)</button>
    </div>
  </div>

  <div class="form-group">
    <label>チップ率 (税込総額基準)</label>
    <div class="btn-group col-2">
      <button type="button" class="toggle-btn active" id="btnTip10" onclick="setTip(10)">10%</button>
      <button type="button" class="toggle-btn" id="btnTip15" onclick="setTip(15)">15%</button>
    </div>
  </div>

  <div class="form-group">
    <label>人数</label>
    <input type="number" id="peopleCount" value="4" min="1" inputmode="numeric">
  </div>

  <div class="result-box">
    <div class="per-person-label">1人あたりの支払額（切り上げ / 正確な額）</div>
    <div class="per-person-container">
      <span class="per-person-val" id="perPersonDisplay">279 MXN</span>
      <span class="per-person-exact" id="perPersonExactDisplay">(279.00 MXN)</span>
    </div>

    <div class="details">
      <div class="details-row"><span>対象基本額:</span><span id="baseAmountDisplay">1,000.00 MXN</span></div>
      <div class="details-row"><span>チップ額:</span><span id="tipDisplay">116.00 MXN</span></div>
      <div class="details-row" id="taxRow"><span>控除されたIVA (16%):</span><span id="taxDisplay">-160.00 MXN</span></div>
      <div class="details-row total"><span>割るべき合計額:</span><span id="targetTotalDisplay">1,116.00 MXN</span></div>
    </div>
  </div>
</div>

<script>
  let ivaMode = 'deduct'; // デフォルト: IVA控除
  let tipPercent = 10;    // デフォルト: チップ10%

  function setIvaMode(mode) {
    ivaMode = mode;
    document.getElementById('btnIvaDeduct').classList.toggle('active', mode === 'deduct');
    document.getElementById('btnIvaInclude').classList.toggle('active', mode === 'include');
    calculate();
  }

  function setTip(pct) {
    tipPercent = pct;
    document.getElementById('btnTip10').classList.toggle('active', pct === 10);
    document.getElementById('btnTip15').classList.toggle('active', pct === 15);
    calculate();
  }

  function calculate() {
    const total = parseFloat(document.getElementById('totalAmount').value) || 0;
    const people = parseInt(document.getElementById('peopleCount').value, 10) || 1;

    // チップ額は常に税込総額基準
    const tip = total * (tipPercent / 100);

    let baseAmount = 0;
    let targetTotal = 0;
    const taxRow = document.getElementById('taxRow');

    if (ivaMode === 'deduct') {
      // IVA控除モード: 料理本体価格（税抜） + チップ
      baseAmount = total / 1.16;
      const tax = total - baseAmount;
      targetTotal = baseAmount + tip;

      taxRow.style.display = 'flex';
      document.getElementById('baseAmountDisplay').innerText = baseAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN (本体)';
      document.getElementById('taxDisplay').innerText = '-' + tax.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN';
    } else {
      // IVA込みモード: 総額 + チップ
      baseAmount = total;
      targetTotal = total + tip;

      taxRow.style.display = 'none';
      document.getElementById('baseAmountDisplay').innerText = baseAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN (総額)';
    }

    const rawPerPerson = targetTotal / Math.max(1, people);

    // 1ペソ単位の切り上げ（現金精算向け）
    const perPersonCeil = Math.ceil(rawPerPerson);

    // 小数点第2位までの切り上げ（電子送金・正確な精算向け）
    const perPersonExactCeil = (Math.ceil(rawPerPerson * 100) / 100).toFixed(2);

    // 画面反映
    document.getElementById('tipDisplay').innerText = tip.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN';
    document.getElementById('targetTotalDisplay').innerText = targetTotal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN';
    document.getElementById('perPersonDisplay').innerText = perPersonCeil.toLocaleString() + ' MXN';
    document.getElementById('perPersonExactDisplay').innerText = '(' + Number(perPersonExactCeil).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN)';
  }

  document.getElementById('totalAmount').addEventListener('input', calculate);
  document.getElementById('peopleCount').addEventListener('input', calculate);
  calculate();
</script>

</body>
</html>
